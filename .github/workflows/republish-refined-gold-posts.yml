name: Republish Refined Gold Analysis Posts

on:
  push:
    branches:
      - main
    paths:
      - "republish_refined_posts.trigger"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish refined technical analysis
        env:
          PUBLISH_TO_TELEGRAM: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -u publish_gold_report.py --file gold_technical_refined.txt
      - name: Publish refined macro analysis
        env:
          PUBLISH_TO_TELEGRAM: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -u publish_gold_report.py --file gold_macro_refined.txt
      - name: Publish refined periodic analysis
        env:
          PUBLISH_TO_TELEGRAM: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -u publish_gold_report.py --file gold_periodic_refined.txt
