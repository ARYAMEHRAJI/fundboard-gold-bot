name: Publish All Real FundBoard Silver Posts
on:
  push:
    branches: [main]
    paths: ["publish_all_real_silver_posts.py", ".github/workflows/publish-all-real-silver-posts.yml"]
permissions:
  contents: read
concurrency:
  group: fundboard-silver-publish-all-now
  cancel-in-progress: false
jobs:
  publish-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_SILVER_BOT_TOKEN: ${{ secrets.TELEGRAM_SILVER_BOT_TOKEN }}
      TELEGRAM_SILVER_CHANNEL_ID: "@FundBoard_Silver"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 openpyxl
      - name: Publish each real content category
        run: python publish_all_real_silver_posts.py
