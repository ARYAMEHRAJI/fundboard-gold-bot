
name: Publish Gold Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
    - cron: "30 14 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and publish analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import urllib.parse
          import urllib.request

          result = subprocess.run(
              ["python", "generate_analysis.py"],
              capture_output=True,
              text=True,
              check=True
          )

          message = result.stdout.strip()
          if not message:
              raise RuntimeError("Generated analysis is empty")

          if len(message) > 4000:
              raise RuntimeError("Message is too long for safe publishing")

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          channel = os.environ["TELEGRAM_CHANNEL_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = urllib.parse.urlencode({
              "chat_id": channel,
              "text": message
          }).encode("utf-8")

          request = urllib.request.Request(url, data=payload)

          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode("utf-8"))
          PY
          
