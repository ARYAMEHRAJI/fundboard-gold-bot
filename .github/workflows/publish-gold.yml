
name: Publish FundBoard Gold Analysis

on:
  schedule:
    # 10:00 and 18:00 Iran time (UTC+3:30)
    - cron: "30 6,14 * * *"

  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publish to the main Telegram channel now"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fundboard-gold-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate analysis and publish
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PUBLISH_TO_TELEGRAM: ${{ github.event_name == 'schedule' || inputs.publish_now }}
        run: python publish_gold_news.py
