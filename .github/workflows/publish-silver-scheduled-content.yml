name: FundBoard Silver Scheduled Publications

# Temporarily manual-only while post quality and data validation are being corrected.
on:
  workflow_dispatch:
    inputs:
      content_type:
        description: "Which single post type should be published"
        required: true
        type: choice
        options:
          - technical
          - news
          - periodic
          - comparison
          - macro
          - education
          - briefing

permissions:
  contents: read

concurrency:
  group: fundboard-silver-scheduled-publications
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_SILVER_BOT_TOKEN: ${{ secrets.TELEGRAM_SILVER_BOT_TOKEN }}
      TELEGRAM_SILVER_CHANNEL_ID: "@FundBoard_Silver"
      SCHEDULE_KEY: ${{ inputs.content_type }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 openpyxl
      - name: Generate and publish the scheduled post
        run: python publish_silver_scheduled_content.py
