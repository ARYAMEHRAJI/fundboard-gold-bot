name: FundBoard Silver Hourly Publications

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      content_type:
        description: "Post type (leave blank to select the next hourly category)"
        required: false
        type: choice
        options:
          - technical
          - news
          - periodic
          - comparison
          - macro
          - education
          - briefing

permissions:
  contents: read

concurrency:
  group: fundboard-silver-hourly-publications
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_SILVER_BOT_TOKEN: ${{ secrets.TELEGRAM_SILVER_BOT_TOKEN }}
      TELEGRAM_SILVER_CHANNEL_ID: "@FundBoard_Silver"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALLOW_REVIEWED_SILVER_PUBLICATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 openpyxl
      - name: Select content category for this hour
        id: category
        shell: bash
        run: |
          if [ -n "${{ inputs.content_type }}" ]; then
            echo "key=${{ inputs.content_type }}" >> "$GITHUB_OUTPUT"
          else
            hour=$(date -u +%H)
            index=$((10#$hour % 7))
            categories=(technical news periodic comparison macro education briefing)
            echo "key=${categories[$index]}" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and publish one Persian silver post
        env:
          SCHEDULE_KEY: ${{ steps.category.outputs.key }}
        run: python publish_silver_scheduled_content.py
