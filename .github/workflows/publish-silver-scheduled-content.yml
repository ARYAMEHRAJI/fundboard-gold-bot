name: FundBoard Silver Daily Content

on:
  schedule:
    # Iran time: 09:00, 10:30, 12:00, 14:00, 16:00, 18:00, 20:00
    # Iran is UTC+3:30; GitHub cron uses UTC.
    - cron: "30 5 * * *"
    - cron: "0 7 * * *"
    - cron: "30 8 * * *"
    - cron: "30 10 * * *"
    - cron: "30 12 * * *"
    - cron: "30 14 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      content_type:
        description: "Post type (leave blank to select based on the current scheduled slot)"
        required: false
        type: choice
        options:
          - technical
          - news
          - periodic
          - comparison
          - macro
          - education
          - briefing

permissions:
  contents: read

concurrency:
  group: fundboard-silver-hourly-publications
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_SILVER_BOT_TOKEN: ${{ secrets.TELEGRAM_SILVER_BOT_TOKEN }}
      TELEGRAM_SILVER_CHANNEL_ID: "@FundBoard_Silver"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALLOW_REVIEWED_SILVER_PUBLICATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 openpyxl
      - name: Select one daily content category
        id: category
        shell: bash
        run: |
          if [ -n "${{ inputs.content_type }}" ]; then
            echo "key=${{ inputs.content_type }}" >> "$GITHUB_OUTPUT"
          else
            schedule="${{ github.event.schedule }}"
            case "$schedule" in
              "30 5 * * *") key=technical ;;
              "0 7 * * *") key=news ;;
              "30 8 * * *") key=periodic ;;
              "30 10 * * *") key=comparison ;;
              "30 12 * * *") key=macro ;;
              "30 14 * * *") key=education ;;
              "30 16 * * *") key=briefing ;;
              *) key=technical ;;
            esac
            echo "key=$key" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and publish one Persian silver post
        env:
          SCHEDULE_KEY: ${{ steps.category.outputs.key }}
        run: python publish_silver_scheduled_content.py
