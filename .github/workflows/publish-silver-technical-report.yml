name: Publish FundBoard Silver Technical Report

on:
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publish technical report to Telegram now"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "20 15 * * 1-5"

permissions:
  contents: read

concurrency:
  group: fundboard-silver-technical-report
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Generate and publish silver technical report
        env:
          TELEGRAM_SILVER_BOT_TOKEN: ${{ secrets.TELEGRAM_SILVER_BOT_TOKEN }}
          TELEGRAM_SILVER_CHANNEL_ID: "@FundBoard_Silver"
          PUBLISH_TO_TELEGRAM: ${{ github.event_name == 'schedule' || inputs.publish_now }}
        run: python generate_silver_technical_report.py
