name: Validate Gold News and Technical Logic

on:
  push:
    branches:
      - "feature/gold-news-validation"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile analysis scripts
        run: python -m py_compile analyze_gold_news.py publish_gold_news.py generate_gold_technical_report.py generate_gold_macro_report.py

      - name: Run offline tests
        run: python -m unittest -v test_gold_news_logic.py test_gold_technical_report.py test_gold_macro_report.py

      - name: Generate technical draft from live source data
        run: python -u generate_gold_technical_report.py

      - name: Generate macro context draft from dated sources
        run: python -u generate_gold_macro_report.py

      - name: Upload technical draft
        uses: actions/upload-artifact@v4
        with:
          name: gold-technical-draft
          path: gold_technical_draft.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload macro context draft
        uses: actions/upload-artifact@v4
        with:
          name: gold-macro-draft
          path: gold_macro_draft.txt
          if-no-files-found: error
          retention-days: 7
