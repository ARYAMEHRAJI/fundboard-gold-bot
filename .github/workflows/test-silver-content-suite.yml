name: Test FundBoard Silver Content Suite

on:
  push:
    branches: [main]
    paths:
      - "silver_content_suite.py"
      - "publish_silver_prices.py"
      - "generate_silver_technical_report.py"
      - "generate_silver_gold_comparison.py"
      - "build_silver_daily_briefing.py"
      - "analyze_silver_news.py"
      - "generate_silver_periodic_report.py"
      - "generate_silver_macro_report.py"
      - "silver_specialist_posts.py"
      - "analyze_iran_silver_funds.py"
      - ".github/workflows/test-silver-content-suite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run silver price scraper (dry-run only)
        env:
          TELEGRAM_SILVER_CHANNEL_ID: "@FundBoard_Silver"
          PUBLISH_TO_TELEGRAM: "false"
        run: python publish_silver_prices.py
      - name: Run silver technical report (dry-run only)
        env:
          PUBLISH_TO_TELEGRAM: "false"
        run: python generate_silver_technical_report.py
      - name: Run silver content suite (dry-run only)
        run: python silver_content_suite.py
      - name: Run global silver returns and ETF report (dry-run only)
        run: python generate_silver_periodic_report.py
      - name: Run silver macro and fundamental report (dry-run only)
        run: python generate_silver_macro_report.py
      - name: Run AI-assisted silver news analysis (dry-run only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python analyze_silver_news.py
      - name: Generate specialist post (dry-run only)
        run: python silver_specialist_posts.py
      - name: Diagnose Iranian silver-fund source (dry-run only)
        run: python analyze_iran_silver_funds.py
      - name: Run silver-gold comparison report (dry-run only)
        run: python generate_silver_gold_comparison.py
      - name: Build combined daily briefing (dry-run only)
        run: python build_silver_daily_briefing.py
      - name: Upload generated previews and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundboard-silver-dry-run
          path: |
            silver_content_preview/
            silver_gold_comparison_preview.html
            silver_technical_report.txt
          if-no-files-found: warn
          retention-days: 7
