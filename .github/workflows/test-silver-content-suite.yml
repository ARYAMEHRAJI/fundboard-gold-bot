name: Test FundBoard Silver Content Suite

on:
  push:
    branches: [main]
    paths:
      - "silver_content_suite.py"
      - "publish_silver_prices.py"
      - "generate_silver_technical_report.py"
      - "generate_silver_gold_comparison.py"
      - ".github/workflows/test-silver-content-suite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Run silver content suite (dry-run only)
        run: python silver_content_suite.py
      - name: Run silver-gold comparison report (dry-run only)
        run: python generate_silver_gold_comparison.py
      - name: Upload generated previews and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundboard-silver-dry-run
          path: |
            silver_content_preview/
            silver_gold_comparison_preview.html
          if-no-files-found: warn
          retention-days: 7
