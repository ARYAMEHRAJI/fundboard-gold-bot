name: FundBoard Silver Full Parity - Dry Run

on:
  push:
    branches: [main]
    paths:
      - "publish_silver_prices.py"
      - "generate_silver_technical_report.py"
      - "silver_content_suite.py"
      - "analyze_silver_news.py"
      - "generate_silver_macro_report.py"
      - "generate_silver_periodic_report.py"
      - "generate_silver_gold_comparison.py"
      - "silver_specialist_posts.py"
      - "build_silver_daily_briefing.py"
      - "test_silver_content.py"
      - ".github/workflows/silver-full-parity-dry-run.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silver-full-parity-dry-run
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLISH_TO_TELEGRAM: "false"
      TELEGRAM_SILVER_CHANNEL_ID: "@FundBoard_Silver"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4 openpyxl
      - name: Compile every silver module
        run: python -m compileall -q publish_silver_prices.py generate_silver_technical_report.py silver_content_suite.py analyze_silver_news.py generate_silver_macro_report.py generate_silver_periodic_report.py generate_silver_gold_comparison.py silver_specialist_posts.py build_silver_daily_briefing.py analyze_iran_silver_funds.py
      - name: Unit tests for silver analysis
        run: python test_silver_content.py
      - name: Generate physical silver and currency prices preview
        run: python publish_silver_prices.py
      - name: Generate technical analysis preview
        run: python generate_silver_technical_report.py
      - name: Generate market content suite
        run: python silver_content_suite.py
      - name: Generate global performance report
        run: python generate_silver_periodic_report.py
      - name: Generate macro and fundamentals report
        run: python generate_silver_macro_report.py
      - name: Generate news monitoring and impact analysis draft
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python analyze_silver_news.py
      - name: Generate specialist education post
        run: python silver_specialist_posts.py
      - name: Generate gold-silver comparison
        run: python generate_silver_gold_comparison.py
      - name: Build daily briefing
        run: python build_silver_daily_briefing.py
      - name: Verify generated previews and zero publication
        shell: bash
        run: |
          set -euo pipefail
          test -s silver_content_preview/silver_prices.html
          test -s silver_content_preview/technical.html || test -s silver_technical_report.txt
          test -s silver_content_preview/suite_report.json
          test -s silver_content_preview/periodic_returns.html
          test -s silver_content_preview/macro_report.html
          test -s silver_content_preview/news_analysis.html
          test -s silver_content_preview/specialist_post.html
          test -s silver_gold_comparison_preview.html
          test -s silver_content_preview/daily_briefing.html
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("silver_content_preview/suite_report.json").read_text(encoding="utf-8"))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert report.get("telegram_messages_sent") == 0, "Unexpected Telegram publication"
          print("VERIFICATION: all required preview artifacts exist; Telegram messages sent: 0")
          PY
      - name: Upload all previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundboard-silver-full-parity-dry-run
          path: |
            silver_content_preview/
            silver_gold_comparison_preview.html
            silver_technical_report.txt
          if-no-files-found: warn
          retention-days: 7
