
name: Gold Specialist Posts - Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate educational post
        run: python -u gold_specialist_posts.py

      - name: Verify and display draft
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking output file..."

          test -s gold_specialist_draft.html

          echo "Output file exists."
          echo "----- POST PREVIEW START -----"
          cat gold_specialist_draft.html
          echo
          echo "----- POST PREVIEW END -----"

      - name: Upload draft
        uses: actions/upload-artifact@v4
        with:
          name: gold-specialist-draft
          path: gold_specialist_draft.html
          if-no-files-found: error
          retention-days: 7
