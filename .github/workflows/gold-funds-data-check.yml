
name: Gold Funds Data Check - Fundbase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-fundbase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect Fundbase page
        id: inspect
        continue-on-error: true
        run: python -u analyze_iran_gold_funds.py

      - name: Display diagnostic
        if: always()
        shell: bash
        run: |
          if [ -f fundbase_page_diagnostic.txt ]; then
            cat fundbase_page_diagnostic.txt
          else
            echo "No report was generated."
          fi

      - name: Display error
        if: always()
        shell: bash
        run: |
          if [ -f fundbase_error.txt ]; then
            cat fundbase_error.txt
          else
            echo "No error file was generated."
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundbase-gold-diagnostics
          path: |
            fundbase_gold_page.html
            fundbase_page_diagnostic.json
            fundbase_page_diagnostic.txt
            fundbase_error.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Mark failed inspection
        if: steps.inspect.outcome == 'failure'
        run: exit 1
