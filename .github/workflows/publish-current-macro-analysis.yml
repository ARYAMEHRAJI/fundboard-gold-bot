name: Publish current gold macro analysis on request

on:
  push:
    branches:
      - main
    paths:
      - "publish_current_analysis_posts.trigger"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and publish current macro analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PUBLISH_TO_TELEGRAM: "true"
        run: |
          python -u generate_gold_macro_report.py
          python -u publish_gold_report.py --file gold_macro_draft.txt
