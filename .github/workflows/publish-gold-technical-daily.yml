name: Publish Gold Technical Report - Tehran 10:00

on:
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Send this report to Telegram now"
        required: true
        type: boolean
        default: false
  schedule:
    # GitHub Actions cron uses UTC; Iran is UTC+03:30 year-round.
    - cron: "30 6 * * *"

permissions:
  contents: read

concurrency:
  group: publish-gold-technical-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate report
        env:
          WGC_GOLDHUB_COOKIE: ${{ secrets.WGC_GOLDHUB_COOKIE }}
        run: |
          python -u generate_gold_technical_report.py
      - name: Publish to FundBoard Gold Telegram channel
        env:
          PUBLISH_TO_TELEGRAM: ${{ github.event_name == 'schedule' || inputs.publish_now }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -u publish_gold_report.py --file gold_technical_draft.txt
